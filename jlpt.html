<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JLPT Study Lab v8</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182237;--muted:#667085;--line:#dbe3ef;--blue:#3c5bdc;--good:#087443;--bad:#b42318;--soft:#eef3ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--ink)}body{font-size:17px;line-height:1.55}.wrap{max-width:1180px;margin:auto;padding:16px}.top{position:sticky;top:0;z-index:10;background:#ffffffee;border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}.topin{max-width:1180px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;font-size:1.08rem}.levels,.tabs,.actions,.audio{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,textarea{font:inherit}.level,.tab,.btn{border:1px solid #cfd9f2;background:#fff;border-radius:14px;padding:10px 14px;font-weight:800;color:var(--ink);cursor:pointer}.level.on,.tab.on,.btn.primary,.audio button{background:var(--blue);color:#fff;border-color:var(--blue)}.tab.on{box-shadow:inset 0 0 0 2px var(--ink)}.hero,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 24px #1c2d5508}.hero h1{margin:0 0 8px}.tabs{margin-top:14px}.small{font-size:.93rem;color:var(--muted)}.accent{background:var(--soft);border:1px solid #c8d6ff;border-radius:13px;padding:12px 14px;margin:10px 0}.section-title{font-size:1.3rem;font-weight:900;margin:4px 0 12px}.q{border:1px solid #d7e0ee;border-radius:16px;padding:16px;margin:14px 0;background:#fff}.q h3{margin:0 0 6px}.jp{font-family:"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.8}.prompt{font-size:1.05rem;margin:9px 0}.passage{background:#f8fafc;border-left:4px solid #b8c7ed;border-radius:8px;padding:12px 14px;margin:10px 0}.opts{display:grid;gap:7px;margin:10px 0}.opt{padding:9px 10px;border-radius:10px;display:flex;gap:10px}.opt.good{background:#eaf8f1;color:var(--good);font-weight:800}.opt.bad{background:#fff0ed;color:var(--bad);font-weight:800}.feedback{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:800}.feedback.good{display:block;background:#eaf8f1;color:var(--good)}.feedback.bad{display:block;background:#fff0ed;color:var(--bad)}.reason{border-top:1px dashed #d7e0ee;margin-top:13px;padding-top:11px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;align-items:center}.reason select{width:100%;padding:10px;border:1px solid #cfd9f2;border-radius:12px;background:#fff}.audio button{border:0;border-radius:12px;padding:9px 13px;font-weight:800;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{border:1px solid #d7e0ee;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between}.stat b{color:var(--blue)}textarea{width:100%;min-height:150px;border:1px solid #cfd9f2;border-radius:13px;padding:12px}.mockgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mockcard{border:1px solid #d7e0ee;border-radius:14px;padding:13px}.mock-title{scroll-margin-top:90px}@media(max-width:720px){body{font-size:16px}.wrap{padding:10px}.hero,.panel{padding:14px;border-radius:16px}.top{position:static}.stats,.mockgrid{grid-template-columns:1fr}.reason{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brand">日本語能力試驗 JLPT Study Lab v8</div><div class="levels"><span class="small">指定級數</span><button class="level" data-level="N5">N5</button><button class="level" data-level="N4">N4</button><button class="level" data-level="N3">N3</button><button class="level" data-level="N2">N2</button><button class="level" data-level="N1">N1</button></div></div></header>
<main class="wrap">
<section class="hero"><h1>每日自動新題研習</h1><div id="summary" class="small"></div><div id="difficulty" class="accent"></div><div id="jlptV8Status" class="small">正在載入 v8：修正 Full Mock 聽解產題碰撞，並保留官方語速校準。</div><div id="tabs" class="tabs"></div></section>
<section class="panel"><div id="content"></div></section>
<section class="panel"><div class="section-title">弱項與複盤</div><div class="accent"><b>錯題原因統計</b><div id="marked" class="small">本輪已標記 0 題</div><div id="stats" class="stats"></div></div><textarea id="notes" placeholder="記錄今天最常出錯的題型、單字、文法、讀解策略、聽解盲點與下次改善動作…"></textarea></section>
</main>
<script src="./jlpt-loader-v8.js?v=8" defer></script>
</body>
</html>
