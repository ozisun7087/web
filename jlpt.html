*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Noto Sans JP",Arial,sans-serif;background:var(--bg);color:var(--ink)}

reading:[
{id:'n2r1',type:'內容理解（中篇）',pass:'働き方の柔軟性が高まる一方で、仕事と私生活の境界が曖昧になるという問題も指摘されている。自宅で仕事ができること自体は便利だが、いつでも連絡に応じなければならないと感じれば、かえって休みにくくなる。重要なのは、場所を自由にするだけでなく、連絡可能な時間帯についても組織内で共通のルールを設けることだ。',p:'筆者が最も重要だと考えていることは何ですか。',o:['連絡可能な時間帯にも共通ルールを設けること','全員を毎日出社させること','自宅勤務を禁止すること','仕事の連絡を一切しないこと'],a:'連絡可能な時間帯にも共通ルールを設けること',e:'最後一句為作者主張。'},

{id:'n2r3',type:'論點理解（長篇）',pass:'政策を評価するとき、数字で測れる成果だけを重視すると、利用者が実際にどのように感じているかを見落とすことがある。しかし、個人の感想だけでは全体像を判断しにくい。したがって、統計と聞き取りのどちらか一方を選ぶのではなく、互いの弱点を補うように組み合わせる必要がある。',p:'筆者の主張は何ですか。',o:['統計と聞き取りを組み合わせるべきだ','統計は使うべきではない','個人の感想だけで十分だ','評価そのものをやめるべきだ'],a:'統計と聞き取りを組み合わせるべきだ',e:'最後一句即作者結論。'}],

reading:[
{id:'n1r1',type:'內容理解（長篇）',pass:'制度設計では、利用者の選択肢を増やすことが常に自由の拡大につながるとは限らない。選択肢が多すぎれば、比較に必要な情報や時間も増え、かえって決定が難しくなるからである。重要なのは数を増やすこと自体ではなく、利用者が違いを理解し、自分の目的に合った選択をできるように情報を整理することである。',p:'筆者が最も重視していることは何か。',o:['選択肢の違いを理解できるよう情報を整理すること','選択肢をできるだけ多くすること','利用者に比較させないこと','制度を一つに統一すること'],a:'選択肢の違いを理解できるよう情報を整理すること',e:'作者不是主張越多越好，而是讓使用者可理解差異並做合適選擇。'},
{id:'n1r2',type:'綜合理解',pass:'文章A：公共空間は多様な人が偶然出会える余地を残すべきだ。／文章B：利用目的を明確に分けることで、安全で効率的な管理が可能になる。',p:'二つの文章の立場の違いとして最も適切なものはどれか。',o:['Aは用途の余白を重視し、Bは用途の明確化を重視する','AもBも用途を完全に固定すべきだとする','Aは安全性を否定し、Bは交流を否定する','両者に違いはない'],a:'Aは用途の余白を重視し、Bは用途の明確化を重視する',e:'A 重偶發交流的彈性，B 重用途明確與管理效率。'},
{id:'n1r3',type:'論點理解（長篇）',pass:'データに基づく政策判断が重要であることに異論はない。しかし、何をデータとして採用するかという段階ですでに価値判断が入り込む。測定しやすい指標だけを集めれば、測りにくいが重要な影響が見えなくなる可能性がある。したがって、「数字に基づいているから中立だ」と考えるのではなく、指標の選び方そのものを検討対象にすべきである。',p:'筆者の主張は何か。',o:['指標の選択自体にも価値判断があることを意識すべきだ','数字を使う政策判断はすべて誤りだ','測定しにくいものは政策から除外すべきだ','データがあれば完全に中立な判断ができる'],a:'指標の選択自体にも価値判断があることを意識すべきだ',e:'核心在於指標選擇本身也需被檢討。'}],

};
function allFor(skill){return DATA[state.level][skill]||[]}
function sectionItems(skill){const a=allFor(skill);const t=tier(state.level);return a.slice(0,Math.min(a.length,3+t))}
function qkey(q){return state.level+'|'+state.tab+'|'+q.id}
function pickOptions(q){if(!q._order)q._order=shuffle(q.o);return q._order}
function reasonSelect(key){const cur=state.reasons[key]||'';return '<div class="reason"><b>錯題原因</b><select data-reason="'+esc(key)+'"><option value="">未選擇錯題原因</option>'+REASONS.map(x=>'<option '+(cur===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></div>'}
function mcq(q,skill){const key=state.level+'|'+skill+'|'+q.id,sel=state.answers[key]||'',checked=state.checked[key],rev=state.revealed[key],opts=pickOptions(q);let oh=opts.map((o,i)=>{let cls='opt';if(rev&&o===q.a)cls+=' good';if(rev&&sel&&o===sel&&o!==q.a)cls+=' bad';return '<label class="'+cls+'"><input type="radio" name="'+esc(key)+'" value="'+esc(o)+'" '+(sel===o?'checked':'')+'> <span>'+String.fromCharCode(65+i)+'. '+esc(o)+'</span></label>'}).join('');let fb='';if(checked){const ok=sel===q.a;fb='<div class="feedback '+(ok?'good':'bad')+'">'+(ok?'✓ 正確':'✗ 再檢查一次')+'</div>'}const audio=q.audio?'<div class="audio"><button type="button" data-speak="'+esc(q.audio)+'">▶ 播放音檔</button><span class="small">日語語音可重播</span></div>':'';const passage=q.pass?'<div class="passage jp">'+esc(q.pass)+'</div>':'';const target=q.target?'<div class="small">目標：<b class="jp">'+esc(q.target)+'</b></div>':'';return '<article class="q" data-q="'+esc(key)+'"><h3>'+esc(q.type)+'</h3>'+passage+audio+'<div class="prompt jp">'+esc(q.p)+'</div>'+target+'<div class="opts">'+oh+'</div><div class="actions"><button class="btn" data-check="'+esc(key)+'">檢查答案</button><button class="btn" data-show="'+esc(key)+'">顯示答案</button></div>'+fb+(rev?'<div class="accent"><b>正確答案：</b><span class="jp">'+esc(q.a)+'</span><br><span class="small">'+esc(q.e)+'</span></div>':'')+reasonSelect(key)+'</article>'}
function renderSkill(skill,title){const items=sectionItems(skill);return '<div class="section-title">'+title+'</div><div class="accent"><b>今日難度：'+TL[tier(state.level)]+'</b><div class="small">'+(prior(state.level)?'依前次 '+state.level+' 作答正確率調整。':'無前次紀錄，使用簡單基準。')+'</div></div>'+items.map(q=>mcq(q,skill)).join('')+'<div class="actions"><button class="btn primary" data-finish="'+skill+'">完成本區並記錄</button></div>'}
function weakness(){const counts={};REASONS.forEach(r=>counts[r]=0);Object.values(state.reasons).forEach(r=>{if(r)counts[r]++});const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return '<div class="section-title">弱項</div><div class="accent"><b>本輪主要弱項</b><div>'+top.slice(0,3).map(([r,n])=>esc(r)+'：'+n).join('　')+'</div></div><div class="small">建議先回到錯誤最多的題型練習，再用模擬題確認是否改善。</div>'}
function mock(){const groups=[['vocab','文字・語彙'],['grammar','文法'],['reading','讀解'],['listening','聽解']];return '<div class="section-title">'+state.level+' 模擬</div><div class="accent"><b>官方基準時間：</b>'+esc(LEVEL_TIMES[state.level])+'<div class="small">本站目前提供互動式迷你模擬；題目為本站原創練習題，不是官方試題。</div></div><div class="mockgrid">'+groups.map(([s,n])=>'<div class="mockcard"><b>'+n+'</b><div class="small">'+allFor(s).length+' 題題庫</div><button class="btn primary" data-mockskill="'+s+'">開始 '+n+'</button></div>').join('')+'</div><div id="mockArea"></div>'}
function review(){return '<div class="section-title">複盤</div><div class="accent"><b>本輪完成度</b><div class="small">已作答 '+Object.keys(state.answers).filter(k=>k.startsWith(state.level+'|')).length+' 題；已標記錯題原因 '+Object.values(state.reasons).filter(Boolean).length+' 題。</div></div><textarea id="reviewInner" placeholder="寫下今天最重要的 2 個弱項，以及下一次要採取的具體改善方式。">'+esc(document.getElementById('reviewNotes')?.value||'')+'</textarea>'}
function render(){document.querySelectorAll('.level').forEach(b=>b.classList.toggle('on',b.dataset.level===state.level));document.getElementById('officialSummary').textContent=state.level+'｜'+LEVEL_TIMES[state.level]+'。題型依官方 JLPT 架構分類。';const p=prior(state.level);document.getElementById('difficultyNote').innerHTML='<b>今日難度：'+TL[tier(state.level)]+'</b><br><span class="small">'+(p?'上次正確率 '+Math.round(p.accuracy*100)+'% → 本輪自動調整。':'無前次紀錄，使用簡單基準。')+' 重新整理頁面會清空本輪作答。</span>';document.getElementById('tabs').innerHTML=TABS.map(([id,n])=>'<button class="tab '+(state.tab===id?'on':'')+'" data-tab="'+id+'">'+n+'</button>').join('');let html='';if(state.tab==='vocab')html=renderSkill('vocab','文字・語彙');if(state.tab==='grammar')html=renderSkill('grammar','文法');if(state.tab==='reading')html=renderSkill('reading','讀解');if(state.tab==='listening')html=renderSkill('listening','聽解');if(state.tab==='weakness')html=weakness();if(state.tab==='mock')html=mock();if(state.tab==='review')html=review();document.getElementById('content').innerHTML=html;updateStats()}
function updateStats(){const c={};REASONS.forEach(r=>c[r]=0);Object.values(state.reasons).forEach(r=>{if(r)c[r]++});document.getElementById('reasonStats').innerHTML=REASONS.map(r=>'<div class="stat"><span>'+r+'</span><b>'+c[r]+'</b></div>').join('');document.getElementById('markedCount').textContent='本輪已標記 '+Object.values(state.reasons).filter(Boolean).length+' 題'}
function findQ(key){const parts=key.split('|'),skill=parts[1],id=parts.slice(2).join('|');return (DATA[parts[0]]?.[skill]||[]).find(q=>q.id===id)}
function finish(skill){const qs=allFor(skill),done=qs.filter(q=>state.answers[state.level+'|'+skill+'|'+q.id]);if(!done.length){alert('請先作答至少一題。');return}const ok=done.filter(q=>state.answers[state.level+'|'+skill+'|'+q.id]===q.a).length,acc=ok/done.length;saveHistory(acc);alert('本區 '+ok+'/'+done.length+'，正確率 '+Math.round(acc*100)+'%。已記錄為今天的 '+state.level+' 練習摘要。')}
function speak(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';u.rate=.92;const vs=speechSynthesis.getVoices(),v=vs.find(x=>/^ja/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){alert('目前瀏覽器無法播放日語語音。')}}
document.addEventListener('change',e=>{const r=e.target.closest('[data-reason]');if(r){state.reasons[r.dataset.reason]=r.value;updateStats();return}if(e.target.matches('input[type=radio]'))state.answers[e.target.name]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.level){state.level=b.dataset.level;state.tab='vocab';state.answers={};state.reasons={};state.checked={};state.revealed={};render();return}if(b.dataset.tab){state.tab=b.dataset.tab;render();return}if(b.dataset.check){const q=findQ(b.dataset.check);if(!q)return;const sel=state.answers[b.dataset.check];if(!sel){alert('請先選擇答案。');return}state.checked[b.dataset.check]=true;render();return}if(b.dataset.show){state.revealed[b.dataset.show]=true;render();return}if(b.dataset.speak){speak(b.dataset.speak);return}if(b.dataset.finish){finish(b.dataset.finish);render();return}if(b.dataset.mockskill){const skill=b.dataset.mockskill;const area=document.getElementById('mockArea');area.innerHTML='<div class="section-title" style="margin-top:18px">Mock '+({vocab:'文字・語彙',grammar:'文法',reading:'讀解',listening:'聽解'}[skill])+'</div>'+allFor(skill).map(q=>mcq(q,skill)).join('');return}});
document.addEventListener('input',e=>{if(e.target.id==='reviewInner'){const x=document.getElementById('reviewNotes');if(x)x.value=e.target.value}});
window.addEventListener('beforeunload',()=>{try{speechSynthesis.cancel()}catch(e){}});
render();
})();
</script>
</body>
</html>
