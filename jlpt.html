{id:'n1r1',type:'內容理解（長篇）',pass:'制度設計では、選択肢を増やすことが常に自由の拡大につながるとは限らない。選択肢が多すぎれば比較に必要な情報や時間も増える。重要なのは数ではなく、利用者が違いを理解し、自分の目的に合った選択をできるよう情報を整理することだ。',p:'筆者が最も重視していることは何か。',o:['選択肢の違いを理解できるよう情報を整理すること','選択肢をできるだけ多くすること','利用者に比較させないこと','制度を一つに統一すること'],a:'選択肢の違いを理解できるよう情報を整理すること',e:'作者重視可理解的資訊整理。'},
{id:'n1r2',type:'論點理解（長篇）',pass:'データに基づく政策判断は重要だが、何をデータとして採用するかという段階ですでに価値判断が入り込む。したがって「数字に基づくから中立」と考えるのではなく、指標の選び方そのものを検討対象にすべきである。',p:'筆者の主張は何か。',o:['指標の選択自体にも価値判断があることを意識すべきだ','数字を使う判断はすべて誤りだ','測定しにくいものは除外すべきだ','データがあれば完全に中立だ'],a:'指標の選択自体にも価値判断があることを意識すべきだ',e:'核心是指標選擇本身也包含價值判斷。'}],

{id:'n1l2',type:'重點理解',audio:'男の人：調査対象を広げればデータは増えますが、比較条件がそろわなくなる恐れがあります。今回は範囲を限定し、同じ基準で詳しく見るほうがいいでしょう。',p:'男の人はどの方法を勧めていますか。',o:['対象を限定して同じ基準で詳しく調べる','対象をできるだけ増やす','比較をやめる','基準を毎回変える'],a:'対象を限定して同じ基準で詳しく調べる',e:'建議限定範圍後深入比較。'},
{id:'n1l3',type:'概要理解',audio:'女の人：制度を変えるとき、内容そのものだけでなく、なぜ変えるのかを利用者に説明することが大切です。理由が分からないまま変更だけ求められると反発が強くなることがあります。',p:'女の人が最も言いたいことは何ですか。',o:['制度変更の理由も丁寧に説明すべきだ','制度は変えるべきではない','反発は無視すべきだ','説明より速度が重要だ'],a:'制度変更の理由も丁寧に説明すべきだ',e:'主旨是改革理由也必須說明。'}]}
};
function dkey(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function hist(){try{return JSON.parse(localStorage.getItem(HIST)||'{}')||{}}catch(e){return{}}}
function prior(){const a=Array.isArray(hist()[S.level])?hist()[S.level]:[];return a.filter(x=>x.date<dkey()).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function tier(){const p=prior();if(!p)return 0;return p.acc<.6?0:p.acc<.8?1:p.acc<.9?2:3}
const TL=['基礎','標準','進階','挑戰'];
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function items(skill){const a=DATA[S.level][skill]||[],n=Math.min(a.length,2+tier());return a.slice(0,Math.max(2,n))}
function key(skill,q){return S.level+'|'+skill+'|'+q.id}
function options(q){if(!q._order)q._order=shuffle(q.o);return q._order}
function reason(k){const cur=S.reasons[k]||'';return '<div class="reason"><b>錯題原因</b><select data-reason="'+esc(k)+'"><option value="">未選擇錯題原因</option>'+REASONS.map(r=>'<option '+(cur===r?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>'}
function card(q,skill){const k=key(skill,q),sel=S.answers[k]||'',show=S.shown[k],checked=S.checked[k];const opts=options(q).map((o,i)=>{let c='opt';if(show&&o===q.a)c+=' good';if(show&&sel===o&&o!==q.a)c+=' bad';return '<label class="'+c+'"><input type="radio" name="'+esc(k)+'" value="'+esc(o)+'" '+(sel===o?'checked':'')+'> <span>'+String.fromCharCode(65+i)+'. '+esc(o)+'</span></label>'}).join('');const audio=q.audio?'<div class="audio"><button data-speak="'+esc(q.audio)+'">▶ 播放音檔</button><span class="small">可重複播放</span></div>':'';const passage=q.pass?'<div class="passage jp">'+esc(q.pass)+'</div>':'';const fb=checked?'<div class="feedback '+(sel===q.a?'good':'bad')+'">'+(sel===q.a?'✓ 正確':'✗ 再檢查一次')+'</div>':'';const ans=show?'<div class="accent"><b>正確答案：</b><span class="jp">'+esc(q.a)+'</span><br><span class="small">'+esc(q.e)+'</span></div>':'';return '<article class="q"><h3>'+esc(q.type)+'</h3>'+passage+audio+'<div class="prompt jp">'+esc(q.p)+'</div><div class="opts">'+opts+'</div><div class="actions"><button class="btn" data-check="'+esc(k)+'">檢查答案</button><button class="btn" data-show="'+esc(k)+'">顯示答案</button></div>'+fb+ans+reason(k)+'</article>'}
function skill(skill,title){return '<div class="section-title">'+title+'</div><div class="accent"><b>今日難度：'+TL[tier()]+'</b><div class="small">'+(prior()?'依前次 '+S.level+' 正確率調整。':'無前次紀錄，使用簡單基準。')+'</div></div>'+items(skill).map(q=>card(q,skill)).join('')+'<button class="btn primary" data-finish="'+skill+'">完成本區並記錄</button>'}
function weak(){const c=Object.fromEntries(REASONS.map(r=>[r,0]));Object.values(S.reasons).forEach(r=>{if(r)c[r]++});const top=Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,3);return '<div class="section-title">弱項</div><div class="accent"><b>本輪主要弱項</b><div>'+top.map(x=>esc(x[0])+'：'+x[1]).join('　')+'</div></div><div class="small">先回到錯誤最多的題型，再用模擬題確認改善。</div>'}
function mock(){const g=[['vocab','文字・語彙'],['grammar','文法'],['reading','讀解'],['listening','聽解']];return '<div class="section-title">'+S.level+' 模擬</div><div class="accent"><b>官方基準時間：</b>'+esc(TIMES[S.level])+'<div class="small">本站為互動式迷你模擬，題目為本站原創，不是官方試題。</div></div><div class="mockgrid">'+g.map(x=>'<div class="mockcard"><b>'+x[1]+'</b><div class="small">'+DATA[S.level][x[0]].length+' 題題庫</div><button class="btn primary" data-mock="'+x[0]+'">開始</button></div>').join('')+'</div><div id="mockArea"></div>'}
function review(){return '<div class="section-title">複盤</div><div class="accent"><b>本輪完成度</b><div class="small">已作答 '+Object.keys(S.answers).filter(k=>k.startsWith(S.level+'|')).length+' 題；已標記錯題原因 '+Object.values(S.reasons).filter(Boolean).length+' 題。</div></div><textarea id="innerNotes" placeholder="寫下今天最重要的 2 個弱項與下一次改善動作。">'+esc(document.getElementById('notes').value)+'</textarea>'}
function render(){document.querySelectorAll('.level').forEach(b=>b.classList.toggle('on',b.dataset.level===S.level));document.getElementById('summary').textContent=S.level+'｜'+TIMES[S.level]+'。題型依 JLPT 官方分類架構設計。';const p=prior();document.getElementById('difficulty').innerHTML='<b>今日難度：'+TL[tier()]+'</b><br><span class="small">'+(p?'上次正確率 '+Math.round(p.acc*100)+'% → 本輪自動調整。':'無前次紀錄，使用簡單基準。')+' 重新整理頁面會清空本輪作答。</span>';document.getElementById('tabs').innerHTML=TAB.map(x=>'<button class="tab '+(S.tab===x[0]?'on':'')+'" data-tab="'+x[0]+'">'+x[1]+'</button>').join('');let h='';if(S.tab==='vocab')h=skill('vocab','文字・語彙');else if(S.tab==='grammar')h=skill('grammar','文法');else if(S.tab==='reading')h=skill('reading','讀解');else if(S.tab==='listening')h=skill('listening','聽解');else if(S.tab==='weakness')h=weak();else if(S.tab==='mock')h=mock();else h=review();document.getElementById('content').innerHTML=h;stats()}
function stats(){const c=Object.fromEntries(REASONS.map(r=>[r,0]));Object.values(S.reasons).forEach(r=>{if(r)c[r]++});document.getElementById('stats').innerHTML=REASONS.map(r=>'<div class="stat"><span>'+r+'</span><b>'+c[r]+'</b></div>').join('');document.getElementById('marked').textContent='本輪已標記 '+Object.values(S.reasons).filter(Boolean).length+' 題'}
function find(k){const [lv,skill,id]=k.split('|');return (DATA[lv]?.[skill]||[]).find(q=>q.id===id)}
function finish(skillName){const a=DATA[S.level][skillName]||[],done=a.filter(q=>S.answers[key(skillName,q)]);if(!done.length){alert('請先作答至少一題。');return}const ok=done.filter(q=>S.answers[key(skillName,q)]===q.a).length,acc=ok/done.length;const h=hist(),arr=Array.isArray(h[S.level])?h[S.level]:[],it={date:dkey(),acc,ts:Date.now()},i=arr.findIndex(x=>x.date===it.date);if(i>=0)arr[i]=it;else arr.push(it);h[S.level]=arr.slice(-20);localStorage.setItem(HIST,JSON.stringify(h));alert('本區 '+ok+'/'+done.length+'，正確率 '+Math.round(acc*100)+'%。已記錄。')}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/^ja/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){alert('目前瀏覽器無法播放日語語音。')}}
document.addEventListener('change',e=>{if(e.target.matches('input[type=radio]'))S.answers[e.target.name]=e.target.value;const r=e.target.closest('[data-reason]');if(r){S.reasons[r.dataset.reason]=r.value;stats()}});
document.addEventListener('input',e=>{if(e.target.id==='innerNotes')document.getElementById('notes').value=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.level){S.level=b.dataset.level;S.tab='vocab';S.answers={};S.checked={};S.shown={};S.reasons={};render();return}if(b.dataset.tab){S.tab=b.dataset.tab;render();return}if(b.dataset.check){if(!S.answers[b.dataset.check]){alert('請先選擇答案。');return}S.checked[b.dataset.check]=true;render();return}if(b.dataset.show){S.shown[b.dataset.show]=true;render();return}if(b.dataset.speak){speak(b.dataset.speak);return}if(b.dataset.finish){finish(b.dataset.finish);render();return}if(b.dataset.mock){const s=b.dataset.mock;document.getElementById('mockArea').innerHTML='<div class="section-title" style="margin-top:18px">Mock '+s+'</div>'+DATA[S.level][s].map(q=>card(q,s)).join('');return}});
render();
})();
</script>
</body>
