<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3157d5"><title>TOEFL iBT 2026｜2026-08-29 完整模擬考</title>
<style>:root{--b:#3157d5;--bg:#f4f7fb;--c:#fff;--t:#182237;--m:#667085;--l:#dbe3ef;--ok:#14785a;--bad:#b42318}*{box-sizing:border-box;min-width:0}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif}main{max-width:980px;margin:auto;padding:12px 12px 60px}.hero,.card,.q{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px;margin:10px 0}.hero{background:linear-gradient(135deg,#fff,#eef3ff)}h1{font-size:clamp(1.7rem,6vw,2.7rem);line-height:1.1;margin:5px 0}.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px;position:sticky;top:0;background:#f4f7fb;z-index:2}.tab,button{min-height:44px;border:0;border-radius:11px;padding:9px 13px;font-weight:800;background:var(--b);color:#fff;touch-action:manipulation}.tab{flex:0 0 auto;background:#fff;color:var(--t);border:1px solid var(--l)}.tab.active{background:var(--t);color:#fff}.muted,.small{color:var(--m)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.q{background:#fafcff}.audio{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.ghost{background:#fff;color:var(--b);border:1px solid #c7d3f7}.option{display:block;padding:10px;border-radius:9px}.option:has(input:checked){background:#eef3ff}input[type=text],textarea,select{width:100%;border:1px solid #cfd8e6;border-radius:10px;padding:10px;background:#fff;font:inherit;font-size:16px}textarea{min-height:120px}.feedback{margin-top:8px;padding:8px 10px;border-radius:9px}.ok{background:#edf9f4;color:#126147}.bad{background:#fff1ef;color:#9f241b}.score{margin-top:12px;padding:12px;border:1px solid #c8d6ff;border-radius:12px;background:#f7f9ff;font-weight:850}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.actions>*{flex:1 1 150px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:4px 8px;border:1px solid var(--l);border-radius:999px;background:#fff;font-size:12px}.timer{font-size:1.6rem;font-weight:900}@media(max-width:720px){.grid{grid-template-columns:1fr}.hero,.card,.q{padding:12px;border-radius:13px}.tabs{top:0}.actions>*{flex-basis:100%}}</style></head>
<body><main>
<section class="hero"><div class="small">2026 NEW TOEFL iBT｜今日：2026-08-29｜Saturday Mock</div><h1>完整新版 TOEFL iBT 模擬考</h1><p>目標：4.5 → 5.0。全部題目、作答、計時與訂正都在本頁；不使用外部題本或外部連結。</p><div class="chips"><span class="chip">Reading 20</span><span class="chip">Listening 18</span><span class="chip">Writing 10+Email+Discussion</span><span class="chip">Speaking 7+4</span><span class="chip">手機優先</span></div></section>
<section class="card"><div class="grid"><div><b>模擬考計時</b><div class="timer" id="timer">00:00:00</div></div><div class="actions"><button id="start">開始</button><button class="ghost" id="pause">暫停</button><button class="ghost" id="reset">歸零</button></div></div></section>
<div class="tabs" id="tabs"></div><section class="card" id="app"></section>
</main>
<script>
const $=s=>document.querySelector(s),norm=s=>String(s).trim().toLowerCase().replace(/[.,!?']/g,'').replace(/\s+/g,' '),esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]||m));
const accents=['en-US','en-GB','en-AU','en-NZ'];
const R=[
['According to the passage, what is a common limitation of measuring neighborhood change only through property values?',['It ignores social effects','It always lowers rent','It measures traffic perfectly','It replaces interviews'],0],
['Why can affordable housing policies reduce displacement?',['They can help existing residents remain','They eliminate all redevelopment','They increase construction costs','They reduce public participation'],0],
['What does place attachment refer to?',['Emotional bonds with places','A zoning category','A construction method','A transport fare'],0],
['Why are ethnographic interviews useful?',['They reveal lived experiences','They eliminate statistics','They predict every rent change','They measure building height'],0],
['What tension can historic preservation create?',['Cultural identity versus development capacity','Tourism versus weather','Schools versus rainfall','Transit versus language'],0],
['What is one benefit of resident participation?',['It can reveal concerns missed by technical plans','It guarantees consensus','It removes the need for planners','It prevents all conflict'],0],
['What does social continuity emphasize?',['Maintaining relationships and routines','Increasing parking fees','Changing street names','Building taller towers'],0],
['Why might planners combine quantitative and qualitative evidence?',['To understand neighborhood change more fully','To avoid collecting data','To reduce sample size to zero','To remove context'],0],
['Which statement best describes a trade-off in redevelopment?',['Safety may improve while affordability falls','Every benefit has no cost','Preservation always reduces identity','Transit always causes displacement'],0],
['What can public interest include?',['Safety, accessibility, affordability, and social continuity','Only property value','Only investor returns','Only construction speed'],0],
['Why might tenants be affected differently from homeowners?',['They have different housing and financial positions','They design the buildings','They own the zoning map','They always receive subsidies'],0],
['What is a fieldwork reminder useful for?',['Improving participation without repeated pressure','Forcing responses','Changing interview answers','Replacing informed consent'],0],
['What is the main purpose of a public meeting in planning?',['To provide information and hear public views','To guarantee approval','To set every rent','To hire contractors'],0],
['Why can preservation rules affect housing supply?',['They can limit land available for new construction','They remove all housing demand','They increase every building height','They eliminate neighborhoods'],0],
['What is a likely consequence of ignoring residents’ routines?',['Some everyday effects may be overlooked','Every plan becomes cheaper','All social ties improve','Traffic disappears'],0],
['Why is accessibility part of public interest?',['It affects whether people can use services and spaces','It only concerns property tax','It changes historical dates','It measures investor profit'],0],
['What does displacement mean in the passage context?',['Residents moving away as neighborhood conditions change','Buildings becoming taller','New transit opening','Researchers changing methods'],0],
['Why should planners consider both physical and social outcomes?',['Urban change affects buildings and people','Physical design is irrelevant','Social outcomes never matter','Only budgets matter'],0],
['What is the author most likely to support?',['Balanced evaluation of redevelopment','Single-metric evaluation','Ignoring residents','Removing preservation entirely'],0],
['Which evidence best complements rent statistics?',['Interviews describing everyday experience','Another rent statistic only','A building color chart','A weather forecast'],0]
];
const LR=[
['Could you send me the revised housing report by this afternoon?',['Yes, I can finish it before three.','The report was interesting.','I sent the afternoon yesterday.'],0],
['Didn’t the professor move the meeting to Friday?',['Yes, she emailed us about it.','Forty students attended.','I prefer meetings.'],0],
['Why don’t we conduct the interviews before the semester ends?',['The interview lasted twenty minutes.','Good idea. We will have more time to analyze them.','The semester begins in September.'],1],
['Do you mind if I record our conversation for my research?',['Not at all. Go ahead.','I did not read it.','The conversation was long.'],0]
];
const LL=[
['Attention residents. Elevator maintenance has been moved from Friday to Thursday morning. The north tower elevator will be unavailable from nine to noon. Residents needing step-free access should use the south entrance.','When will the elevator maintenance occur?',['Friday morning','Thursday morning','Thursday afternoon'],1],
['Student: I planned to interview residents on Monday. Advisor: Monday may be difficult because the community center is closed. Why not Tuesday afternoon? Student: That works, and I can analyze the interviews Wednesday.','When will the interviews probably happen?',['Monday','Tuesday afternoon','Wednesday'],1],
['The public lecture on housing affordability will begin thirty minutes later than announced. Instead of six, it will start at six thirty in Room 201.','What has changed about the public lecture?',['The room','The topic','The starting time'],2],
['Place attachment refers to the emotional bonds people develop with particular locations through memories, social relationships, and repeated everyday activities.','What is the talk mainly about?',['Construction costs','Emotional connections to place','Transportation'],1],
['Researchers distinguish quantitative indicators, such as rent levels, from qualitative evidence, such as interviews describing everyday experience. Combining both can produce a fuller understanding of neighborhood change.','Why do researchers combine both types of evidence?',['To eliminate interviews','To understand change more fully','To reduce sample size'],1],
['Student: Should I only interview homeowners? Professor: No. Include tenants too, because redevelopment may affect them differently.','Why does the professor recommend including tenants?',['They may experience different effects','They own more buildings','They are easier to contact'],0],
['Written comments on the redevelopment plan will be accepted until September eighteenth. The public meeting itself is on September twelfth.','What is the final day for submitting written comments?',['September 12','September 18','September 28'],1],
['Preservation can protect cultural identity, but strict preservation rules may reduce the amount of land available for new housing.','What trade-off is mentioned in the talk?',['Culture and housing supply','Transit and tourism','Safety and education'],0],
['Student: My survey response rate is low. Advisor: Try sending one reminder, but do not send repeated messages because participants may feel pressured.','What does the advisor recommend?',['Send one reminder','Cancel the survey','Call every participant daily'],0],
['Public interest is not always a single objective. A project may improve safety while reducing affordability, so planners often need to balance competing benefits and costs.','What is the main point of the talk?',['Public interest can involve trade-offs','Safety always outweighs affordability','Costs should be ignored'],0],
];
const S=[['the committee / decided to postpone / the public meeting / until next week','The committee decided to postpone the public meeting until next week.'],['residents / were invited to comment / on the redevelopment plan','Residents were invited to comment on the redevelopment plan.'],['the study / examines how housing policy / affects everyday life','The study examines how housing policy affects everyday life.'],['although the project was expensive / it improved / several public facilities','Although the project was expensive, it improved several public facilities.'],['affordable housing / can help / existing residents remain / in a changing neighborhood','Affordable housing can help existing residents remain in a changing neighborhood.'],['planners / should consider / social continuity / as well as physical improvement','Planners should consider social continuity as well as physical improvement.'],['the researcher / combined interviews / with administrative statistics / to study displacement','The researcher combined interviews with administrative statistics to study displacement.'],['historic preservation / may support / local identity / and cultural memory','Historic preservation may support local identity and cultural memory.'],['public interest / includes more than / economic growth / alone','Public interest includes more than economic growth alone.'],['the professor / asked students / to submit their field notes / by Friday','The professor asked students to submit their field notes by Friday.']];
const repeat=['The seminar begins at nine in Room 305.','Please submit the revised proposal before Friday afternoon.','Residents were invited to discuss the redevelopment plan at a public meeting.','The study examines how housing policy affects people’s everyday experience of the city.','Although redevelopment may improve physical conditions, it can also disrupt established social networks.','Affordable housing can help existing residents remain in a changing neighborhood.','Researchers often combine statistical data with interviews to understand lived experience.'];
const interview=['What kind of neighborhood would you prefer to live in, and why?','Do you think cities should preserve old buildings even when redevelopment is more profitable?','Describe one change that could improve daily life in your community.','What can planners learn by talking directly with residents?'];
let timer=0,timerId=null;function showT(){let h=String(Math.floor(timer/3600)).padStart(2,'0'),m=String(Math.floor(timer%3600/60)).padStart(2,'0'),s=String(timer%60).padStart(2,'0');$('#timer').textContent=`${h}:${m}:${s}`}function start(){if(timerId)return;timerId=setInterval(()=>{timer++;showT()},1000)}function pause(){clearInterval(timerId);timerId=null}function reset(){pause();timer=0;showT()}$('#start').onclick=start;$('#pause').onclick=pause;$('#reset').onclick=reset;
function speak(text,lang){if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音播放');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.92;u.pitch=1;speechSynthesis.speak(u)}
function mcq(items,prefix){return items.map((x,i)=>`<div class="q"><b>${i+1}.</b> ${esc(x[0])}<div>${x[1].map((o,j)=>`<label class="option"><input type="radio" name="${prefix}${i}" value="${j}"> ${esc(o)}</label>`).join('')}</div><div class="actions"><button class="ghost check" data-name="${prefix}${i}" data-a="${x[2]}">檢查</button></div><div class="feedback"></div></div>`).join('')}
function audioMCQ(items,prefix,long){return items.map((x,i)=>{const t=long?x[0]+' Question. '+x[1]:x[0];const lang=accents[i%4];return `<div class="q"><b>${i+1}.</b><div class="audio"><button class="play" data-text="${esc(t)}" data-lang="${lang}">▶ 播放${long?'內容＋題問':'問句／陳述'}</button>${long?`<button class="ghost play" data-text="${esc(x[1])}" data-lang="${lang}">↻ 只重播題問</button>`:''}<span class="small">口音：混合訓練</span></div>${x[2].map((o,j)=>`<label class="option"><input type="radio" name="${prefix}${i}" value="${j}"> ${esc(o)}</label>`).join('')}<div class="actions"><button class="ghost check" data-name="${prefix}${i}" data-a="${x[3]===undefined?x[2]&&0:x[3]}">檢查</button></div><div class="feedback"></div></div>`}).join('')}
function build(){const words=S.map((x,i)=>{let a=x[0].split(' / ');for(let k=a.length-1;k>0;k--){let j=(i*7+k*3)% (k+1);[a[k],a[j]]=[a[j],a[k]]}return `<div class="q"><b>${i+1}. Build a Sentence</b><p class="small">字詞組（真正亂序）</p><div class="chips">${a.map(w=>`<span class="chip">${esc(w)}</span>`).join('')}</div><input type="text" id="s${i}" data-a="${esc(x[1])}" placeholder="輸入完整句子"><div class="actions"><button class="ghost scheck" data-id="s${i}">檢查</button></div><div class="feedback"></div></div>`}).join('');return `<h2>Writing</h2><p class="muted">10 題 Build a Sentence（每題 1 分）</p>${words}<div class="q"><h3>Write an Email（0–5）</h3><p>Write to Professor Williams: you cannot attend Friday’s neighborhood field visit. Explain why, ask whether you can join another group, and propose an alternative.</p><textarea id="email"></textarea><div class="actions"><select id="emailScore"><option value="">人工模擬評分</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div></div><div class="q"><h3>Write for an Academic Discussion（0–5）</h3><p><b>Professor:</b> Should governments prioritize physical improvement or preservation of existing communities in urban regeneration?</p><textarea id="disc"></textarea><div class="actions"><select id="discScore"><option value="">人工模擬評分</option>${[0,1,2,3,4,5].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div></div><div class="actions"><button id="wscore">計算 Writing raw 0–20</button></div><div class="score" id="wresult">尚未計分</div>`}
function bind(){document.querySelectorAll('.check').forEach(b=>b.onclick=()=>{const p=document.querySelector(`input[name="${b.dataset.name}"]:checked`),q=b.closest('.q');q.querySelector('.feedback').className='feedback '+(p&&Number(p.value)===Number(b.dataset.a)?'ok':'bad');q.querySelector('.feedback').textContent=p&&Number(p.value)===Number(b.dataset.a)?'✓ 正確':'✗ 再聽／再看一次'});document.querySelectorAll('.play').forEach(b=>b.onclick=()=>speak(b.dataset.text,b.dataset.lang));document.querySelectorAll('.scheck').forEach(b=>b.onclick=()=>{const e=$('#'+b.dataset.id),q=e.closest('.q'),ok=norm(e.value)===norm(e.dataset.a);q.querySelector('.feedback').className='feedback '+(ok?'ok':'bad');q.querySelector('.feedback').textContent=ok?'✓ 正確':'✗ 請檢查語序'});if($('#wscore'))$('#wscore').onclick=()=>{let s=0;S.forEach((x,i)=>{let e=$('#s'+i);if(norm(e.value)===norm(x[1]))s++});let es=Number($('#emailScore').value||0),ds=Number($('#discScore').value||0);$('#wresult').textContent=`Writing raw ${s+es+ds}/20｜Email ${es}/5｜Discussion ${ds}/5`}}
function render(tab){if(tab==='Reading')$('#app').innerHTML='<h2>Reading｜20 題</h2>'+mcq(R,'r')+'<div class="score">Reading：完成後記錄正確數／20</div>';if(tab==='Listening')$('#app').innerHTML='<h2>Listening｜18 題</h2><p class="muted">Listen and Choose a Response 4 題＋Conversation/Announcement/Academic Talk 14 題；每題均有明確題問。</p>'+audioMCQ(LR,'lr',false)+audioMCQ(LL,'ll',true)+'<div class="score">Listening：完成後記錄正確數／18</div>';if(tab==='Writing')$('#app').innerHTML=build();if(tab==='Speaking')$('#app').innerHTML='<h2>Speaking｜7 Listen and Repeat＋4 Take an Interview</h2>'+repeat.map((t,i)=>`<div class="q"><b>${i+1}. Listen and Repeat</b><div class="actions"><button class="play" data-text="${esc(t)}" data-lang="${accents[i%4]}">▶ 播放句子</button><button class="ghost" onclick="window.stopSpeak()">■ 停止</button></div><textarea placeholder="錄音逐字稿／手動輸入"></textarea><select><option>0–5 最終分數</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div>`).join('')+interview.map((t,i)=>`<div class="q"><b>${i+1}. Take an Interview</b><div class="actions"><button class="play" data-text="${esc(t)}" data-lang="${accents[(i+1)%4]}">▶ 播放問題</button><button class="ghost" onclick="window.stopSpeak()">■ 停止</button></div><textarea placeholder="錄音逐字稿／手動輸入"></textarea><select><option>0–5 holistic</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div>`).join('')+'<div class="score">Speaking raw 0–55：7×0–5＋4×0–5</div>';if(tab==='Review')$('#app').innerHTML='<h2>訂正與複盤</h2><p>錯題分類：主旨／細節／推論／語意／口音／記憶／時間壓力。</p><textarea placeholder="記錄今日錯題、錯因、修正策略與下次行動"></textarea>';bind()}
const tabs=['Reading','Listening','Writing','Speaking','Review'];let active='Reading';$('#tabs').innerHTML=tabs.map(t=>`<button class="tab ${t===active?'active':''}" data-t="${t}">${t}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render(active)});window.stopSpeak=()=>speechSynthesis.cancel();render(active);showT();
</script></body></html>
