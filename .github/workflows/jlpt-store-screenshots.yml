name: Capture JLPT Store Screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/jlpt-store-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Install emulator and Android 16 image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'emulator' 'platform-tools' 'system-images;android-36;google_apis;x86_64'
          echo no | avdmanager create avd -n jlpt_store -k 'system-images;android-36;google_apis;x86_64' --force
      - name: Build debug APK
        working-directory: mobile-jlpt/android
        run: gradle :app:assembleDebug
      - name: Boot emulator and capture real app UI
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd jlpt_store -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect >/tmp/emulator.log 2>&1 &
          adb wait-for-device
          READY=0
          for i in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = '1' ]; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then cat /tmp/emulator.log; exit 1; fi
          adb shell wm size 1080x1920
          adb shell wm density 420
          adb install -r mobile-jlpt/android/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n tw.ozisun.jlptstudylab/.MainActivity
          sleep 20
          mkdir -p screenshots/android
          adb exec-out screencap -p > screenshots/android/android-01-home.png
          adb shell input swipe 540 1550 540 650 700
          sleep 3
          adb exec-out screencap -p > screenshots/android/android-02-practice.png
      - uses: actions/upload-artifact@v4
        with:
          name: google-play-screenshots
          path: screenshots/android/*.png

  ios-screenshots:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Prepare project
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pillow || python3 -m pip install --user pillow
          python3 mobile-jlpt/store-listing/generate_store_assets.py
          cd mobile-jlpt/ios && xcodegen generate
      - name: Build simulator app
        working-directory: mobile-jlpt/ios
        run: |
          xcodebuild -project JLPTStudyLab.xcodeproj \
            -scheme JLPTStudyLab \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build
      - name: Capture iPhone and iPad real app UI
        working-directory: mobile-jlpt/ios
        run: |
          set -euo pipefail
          APP="$PWD/build-sim/Build/Products/Debug-iphonesimulator/JLPTStudyLab.app"
          mkdir -p ../../screenshots/ios
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 - <<'PY' > /tmp/selected-devices.txt
          import json,re
          data=json.load(open('/tmp/devices.json'))
          devs=[]
          for runtime,items in data.get('devices',{}).items():
              for d in items:
                  if d.get('isAvailable'):
                      devs.append((runtime,d.get('name',''),d.get('udid','')))
          def pick(patterns, fallback):
              for pat in patterns:
                  for runtime,name,udid in devs:
                      if re.search(pat,name,re.I):
                          return name,udid
              for runtime,name,udid in devs:
                  if re.search(fallback,name,re.I):
                      return name,udid
              return '', ''
          phone=pick([r'iPhone 17 Pro Max',r'iPhone 16 Pro Max',r'iPhone 15 Pro Max'],r'iPhone')
          ipad=pick([r'iPad Pro.*13',r'iPad.*13'],r'iPad')
          print('phone|'+phone[0]+'|'+phone[1])
          print('ipad|'+ipad[0]+'|'+ipad[1])
          PY
          cat /tmp/selected-devices.txt
          while IFS='|' read -r kind name udid; do
            [ -n "$udid" ] || { echo "No simulator for $kind" >&2; exit 1; }
            echo "Capturing $kind on $name ($udid)"
            xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP"
            xcrun simctl launch "$udid" tw.ozisun.jlptstudylab
            sleep 22
            xcrun simctl io "$udid" screenshot "../../screenshots/ios/ios-${kind}-01.png"
            xcrun simctl shutdown "$udid" || true
          done < /tmp/selected-devices.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: screenshots/ios/*.png
