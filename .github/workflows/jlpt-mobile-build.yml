name: Build JLPT Mobile Apps

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Create private Google Play upload key
        shell: bash
        run: |
          echo 'STOP: 1.3.0 already has a canonical Google Play upload key. Do not regenerate a key for a store update. Restore the saved 1.3.0 upload key before enabling this build.' >&2
          exit 1

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify App Store Xcode requirement
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | awk 'NR==1 {split($2,a,"."); print a[1]}')
          test "$MAJOR" -ge 26
      - name: Install build tools
        run: |
          brew install xcodegen
          python3 -m pip install --break-system-packages pillow || python3 -m pip install --user pillow
      - name: Generate App Store and Google Play artwork
        run: python3 mobile-jlpt/store-listing/generate_store_assets.py
      - name: Generate Xcode project
        working-directory: mobile-jlpt/ios
        run: xcodegen generate
      - name: Build unsigned iOS validation app
        working-directory: mobile-jlpt/ios
        run: |
          xcodebuild -project JLPTStudyLab.xcodeproj \
            -scheme JLPTStudyLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JLPTStudyLab.app Payload/
          zip -qry JLPT-Study-Lab-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            mobile-jlpt/ios/JLPT-Study-Lab-iOS-unsigned.ipa
            mobile-jlpt/store-listing/generated/*.png
