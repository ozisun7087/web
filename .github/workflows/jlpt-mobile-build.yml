name: Build JLPT Mobile Apps

on:
  push:
    branches: [main]
    paths:
      - 'mobile-jlpt/**'
      - '.github/workflows/jlpt-mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK
        working-directory: mobile-jlpt/android
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare Android artifact
        run: cp mobile-jlpt/android/app/build/outputs/apk/debug/app-debug.apk JLPT-Study-Lab-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: JLPT-Study-Lab-Android.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: mobile-jlpt/ios
        run: xcodegen generate
      - name: Build unsigned iOS device app
        working-directory: mobile-jlpt/ios
        run: |
          xcodebuild -project JLPTStudyLab.xcodeproj \
            -scheme JLPTStudyLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JLPTStudyLab.app Payload/
          zip -qry JLPT-Study-Lab-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: mobile-jlpt/ios/JLPT-Study-Lab-iOS-unsigned.ipa

  release:
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create/update downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jlpt-mobile-v1 --cleanup-tag -y || true
          gh release create jlpt-mobile-v1 \
            --target "$GITHUB_SHA" \
            --title 'JLPT Study Lab Mobile v1' \
            --notes 'Android: install the APK by allowing installation from this source. iOS: the IPA is unsigned and must be re-signed with an Apple ID/Developer certificate before installation; alternatively install the WebClip configuration profile.'
          gh release upload jlpt-mobile-v1 \
            dist/android/JLPT-Study-Lab-Android.apk \
            dist/ios/JLPT-Study-Lab-iOS-unsigned.ipa \
            mobile-jlpt/ios/JLPT-Study-Lab-iOS-WebClip.mobileconfig \
            --clobber
