<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOEFL iBT 2026 Study Lab</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:#f4f7fb;color:#182237}.loading{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:560px;background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:22px;box-shadow:0 8px 24px #1c2d5510}.error{color:#b42318}</style></head><body><div class="loading"><div class="box" id="status"><b>正在載入 TOEFL iBT 2026 研習站…</b><p>Build a Sentence 已改為真正亂序；Listening 多人對話使用不同聲線；Listening／Speaking 支援穩定重播。</p></div></div><script>
(async()=>{try{let r=await fetch('./index.html?study_fix=v7',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();const patch=`<script>(function(){
/* ---------- Reliable, repeatable speech playback + distinct dialogue voices ---------- */
let __speechToken=0,__speechTimer=null,__speechUtterance=null,__speechBtn=null;
function __resetSpeechButton(btn){if(!btn)return;btn.disabled=false;if(btn.dataset.playLabel)btn.textContent=btn.dataset.playLabel;btn.removeAttribute('aria-busy');}
function __allEnglishVoices(){return((window.speechSynthesis&&speechSynthesis.getVoices())||[]).filter(v=>(v.lang||'').toLowerCase().startsWith('en'))}
function __voicesFor(lang){
 const vs=__allEnglishVoices(),target=String(lang||'en-US').toLowerCase();
 const exact=vs.filter(v=>(v.lang||'').toLowerCase()===target);
 if(exact.length)return exact;
 const base=target.slice(0,2);
 const sameBase=vs.filter(v=>(v.lang||'').toLowerCase().startsWith(base));
 if(sameBase.length)return sameBase;
 return vs;
}
function __findVoice(lang){
 const candidates=__voicesFor(lang);if(candidates.length)return candidates[0];
 if(typeof voiceFor==='function'){try{const v=voiceFor(lang);if(v)return v}catch(e){}}
 return null;
}
function __dialogueSegments(text){
 const s=String(text||'').trim();if(!s)return[];
 const re=/(^|\\s)([A-Z][a-z]+(?:\\s+(?:[A-Z][a-z]+|[A-Z]|\\d+)){0,2}):\\s*/g,matches=[];let m;
 while((m=re.exec(s))){matches.push({speaker:m[2].trim(),labelStart:m.index+(m[1]?m[1].length:0),textStart:re.lastIndex})}
 if(matches.length<2)return[{speaker:null,text:s}];
 const unique=[];matches.forEach(x=>{if(!unique.some(y=>y.toLowerCase()===x.speaker.toLowerCase()))unique.push(x.speaker)});
 if(unique.length<2)return[{speaker:null,text:s}];
 const out=[];
 if(matches[0].labelStart>0){const pre=s.slice(0,matches[0].labelStart).trim();if(pre)out.push({speaker:'Narrator',text:pre})}
 matches.forEach((x,i)=>{const end=i+1<matches.length?matches[i+1].labelStart:s.length;const t=s.slice(x.textStart,end).trim();if(t)out.push({speaker:x.speaker,text:t})});
 return out.length?out:[{speaker:null,text:s}];
}
function __speakerProfiles(segments,lang){
 const names=[];segments.forEach(x=>{if(x.speaker&&!names.includes(x.speaker))names.push(x.speaker)});
 const voices=__voicesFor(lang),pitch=[1.08,.88,1.18,.96,1.03],rate=[.9,.88,.92,.89,.91],map={};
 names.forEach((name,i)=>{map[name]={voice:voices.length>1?voices[i%voices.length]:(voices[0]||__findVoice(lang)),pitch:pitch[i%pitch.length],rate:rate[i%rate.length]}});
 return map;
}
function __speechState(text,lang,btn,token){
 const segments=__dialogueSegments(text),profiles=__speakerProfiles(segments,lang);
 return{segments,profiles,lang:lang||'en-US',btn,token,isDialogue:segments.some(x=>x.speaker)&&new Set(segments.filter(x=>x.speaker).map(x=>x.speaker)).size>1,retried:{}};
}
function __speakQueueItem(state,index){
 if(state.token!==__speechToken)return;
 if(index>=state.segments.length){__resetSpeechButton(state.btn);__speechUtterance=null;return}
 const seg=state.segments[index],u=new SpeechSynthesisUtterance(String(seg.text||'')),profile=seg.speaker?state.profiles[seg.speaker]:null;
 __speechUtterance=u;u.lang=state.lang;u.volume=1;u.rate=profile?profile.rate:.9;u.pitch=profile?profile.pitch:1;
 const v=profile&&profile.voice?profile.voice:__findVoice(state.lang);if(v)u.voice=v;
 u.onstart=()=>{if(state.token!==__speechToken)return;if(state.btn){state.btn.textContent=state.isDialogue?'🔊 播放中｜不同角色不同聲線':'🔊 播放中｜再按可重播';state.btn.setAttribute('aria-busy','true')}};
 u.onend=()=>{if(state.token!==__speechToken)return;__speakQueueItem(state,index+1)};
 u.onerror=()=>{if(state.token!==__speechToken)return;if(!state.retried[index]){state.retried[index]=true;__speechTimer=setTimeout(()=>__speakQueueItem(state,index),160)}else{__speakQueueItem(state,index+1)}};
 try{speechSynthesis.speak(u)}catch(e){u.onerror()}
}
window.__toeflSpeak=function(text,lang,btn){
 if(!('speechSynthesis' in window)){alert('目前瀏覽器不支援語音播放，請改用 Safari／Chrome 開啟。');return}
 const token=++__speechToken;clearTimeout(__speechTimer);
 if(__speechBtn&&__speechBtn!==btn)__resetSpeechButton(__speechBtn);__speechBtn=btn;
 if(btn&&!btn.dataset.playLabel)btn.dataset.playLabel=btn.textContent;
 if(btn){btn.disabled=false;btn.textContent='準備播放…';btn.setAttribute('aria-busy','true')}
 try{speechSynthesis.cancel()}catch(e){};try{if(speechSynthesis.paused)speechSynthesis.resume()}catch(e){}
 const state=__speechState(text,lang,btn,token);__speechTimer=setTimeout(()=>__speakQueueItem(state,0),140);
};
window.speakText=function(text,lang,btn){window.__toeflSpeak(text,lang,btn)};
function wireReliablePlayback(){
 document.querySelectorAll('button.play').forEach(b=>{
   if(!b.dataset.playLabel)b.dataset.playLabel=b.textContent;b.disabled=false;
   b.onclick=(ev)=>{ev.preventDefault();window.__toeflSpeak(b.dataset.text||'',b.dataset.lang||'en-US',b)};
   const segs=__dialogueSegments(b.dataset.text||''),speakerCount=new Set(segs.filter(x=>x.speaker).map(x=>x.speaker)).size;
   if(speakerCount>1){const host=b.closest('.audio')||b.parentElement;if(host&&!host.querySelector('.dialogue-voice-note')){const note=document.createElement('span');note.className='small dialogue-voice-note';note.textContent='多人對話：不同角色使用不同聲線';host.appendChild(note)}}
 });
 document.querySelectorAll('button.splay').forEach(b=>{
   if(!b.dataset.playLabel)b.dataset.playLabel=b.textContent;b.disabled=false;
   b.onclick=(ev)=>{ev.preventDefault();window.__toeflSpeak(b.dataset.text||'','en-US',b)};
 });
}

/* ---------- Build a Sentence: deterministic daily scrambling ---------- */
function __dayKey(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function __hash32(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function __rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function __shuffleChunks(chunks,key){
 const original=chunks.slice(),a=chunks.slice(),rnd=__rng(__hash32(__dayKey()+'|'+key+'|'+original.join('|')));
 for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 if(a.length>1&&a.every((x,i)=>x===original[i]))a.push(a.shift());
 return a;
}
function scrambleSentenceCards(){
 document.querySelectorAll('input[type="text"][id]').forEach(input=>{
   if(!/^(ws|ww|mws)\\d+$/.test(input.id))return;
   const q=input.closest('.q');if(!q)return;
   const prompt=q.firstElementChild;if(!prompt)return;
   let source=prompt.dataset.originalPrompt||prompt.textContent||'';
   if(!source.includes('/'))return;
   prompt.dataset.originalPrompt=source;
   const chunks=source.split('/').map(x=>x.trim()).filter(Boolean);
   if(chunks.length<2)return;
   const shuffled=__shuffleChunks(chunks,input.id);
   prompt.textContent=shuffled.join(' / ');
   prompt.dataset.scrambled='1';
   if(!q.querySelector('.scramble-note')){const note=document.createElement('div');note.className='small scramble-note';note.textContent='字詞組已打亂，請重組成自然且文法正確的英文句子。';prompt.insertAdjacentElement('afterend',note)}
 });
}

function enhanceAll(){wireReliablePlayback();scrambleSentenceCards()}
if(typeof render==='function'){const _render=render;render=function(){_render();setTimeout(enhanceAll,0)}}
if(typeof mockPart==='function'){const _mock=mockPart;mockPart=function(p){_mock(p);setTimeout(enhanceAll,0)}}
if('speechSynthesis'in window){try{speechSynthesis.getVoices()}catch(e){};speechSynthesis.onvoiceschanged=()=>{try{speechSynthesis.getVoices()}catch(e){}}}
if(typeof render==='function')render();setTimeout(enhanceAll,0);setTimeout(enhanceAll,250);
})();<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<b class="error">網站載入失敗</b><p>請重新整理頁面；若仍失敗，請改用 Safari／Chrome 開啟。</p><p class="error">'+String(e.message||e)+'</p>'}})();
