<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TOEFL iBT 2026 Study Lab</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;background:#f4f7fb;color:#182237}.loading{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}.box{max-width:560px;background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:22px;box-shadow:0 8px 24px #1c2d5510}.error{color:#b42318}</style></head><body><div class="loading"><div class="box" id="status"><b>正在載入 TOEFL iBT 2026 研習站…</b><p>Listening 修正版會自動補上每題的題問。</p></div></div><script>
(async()=>{try{let r=await fetch('./index.html?listening_questions=v2',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let html=await r.text();const patch=`<script>(function(){
const qs=[
'When will the elevator maintenance occur?',
'When will the interviews probably happen?',
'What has changed about the public lecture?',
'What is the talk mainly about?',
'Why do researchers combine both types of evidence?',
'Why does the professor recommend including tenants?',
'What is the final day for submitting written comments?',
'What trade-off is mentioned in the talk?',
'What does the advisor recommend?',
'What is the main point of the talk?'
];
if(typeof longListen!=='undefined'&&Array.isArray(longListen)){
 longListen.forEach((x,i)=>{if(qs[i]&&!String(x[0]).includes(' Question. '))x[0]=String(x[0])+' Question. '+qs[i]});
}
function relabelListening(){document.querySelectorAll('button.play').forEach(b=>{let t=b.dataset.text||'';if(t.includes(' Question. ')){b.textContent='▶ 播放內容＋題問';let row=b.closest('.audio');let hint=row&&row.querySelector('.small');if(hint)hint.textContent='音檔最後會播放明確題問，聽完再選答';if(row&&!row.querySelector('.replay-q')){let q=t.split(' Question. ').slice(1).join(' Question. '),rb=document.createElement('button');rb.type='button';rb.className='ghost replay-q';rb.textContent='↻ 只重播題問';rb.addEventListener('click',()=>{if(typeof speakText==='function')speakText(q,b.dataset.lang||'en-US',rb)});row.insertBefore(rb,hint||null)}}else if(b.closest('.q')){let hint=b.closest('.audio')&&b.closest('.audio').querySelector('.small');if(hint&&hint.textContent.includes('建議只播放一次'))hint.textContent='請選擇最適合的回應'}})}
if(typeof render==='function'){const _render=render;render=function(){_render();setTimeout(relabelListening,0)}}
if(typeof mockPart==='function'){const _mock=mockPart;mockPart=function(p){_mock(p);setTimeout(relabelListening,0)}}
if(typeof render==='function')render();setTimeout(relabelListening,0);
})();<\/script>`;html=html.replace('</body>',patch+'</body>');document.open();document.write(html);document.close()}catch(e){document.getElementById('status').innerHTML='<b class="error">網站載入失敗</b><p>請重新整理頁面；若仍失敗，請改用 Safari／Chrome 開啟。</p><p class="error">'+String(e.message||e)+'</p>'}})();
</script></body></html>
