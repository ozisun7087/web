function voices(){try{return ('speechSynthesis'in window?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang||'')&&!BAD.test(v.name||''))}catch(e){return[]}}
function pickVoice(lang){let vs=voices(),exact=vs.filter(v=>(v.lang||'').toLowerCase()===lang.toLowerCase());if(exact[0])return exact[0];let base=lang.slice(0,2).toLowerCase();return vs.find(v=>(v.lang||'').toLowerCase().startsWith(base))||vs[0]||null}

function mcq(items,prefix){return items.map((x,i)=>{if(Array.isArray(x[2]))return `<div class="q"><b>${i+1}.</b> <span class="small">${esc(x[0])}</span><div class="question">${esc(x[1])}</div>${x[2].map((o,j)=>`<label class="option"><input type="radio" name="${prefix}${i}" value="${j}"> ${esc(o)}</label>`).join('')}<button class="ghost check" data-n="${prefix}${i}" data-a="${x[3]}" style="margin-top:8px">檢查</button><div class="feedback"></div></div>`;return `<div class="q"><b>${i+1}.</b> <span class="small">${esc(x[0])}</span><div class="question">${esc(x[1])}</div><input type="text" data-fill="${prefix}${i}" data-a="${esc(x[2])}" placeholder="輸入完整單字"><button class="ghost fillcheck" data-n="${prefix}${i}" style="margin-top:8px">檢查</button><div class="feedback"></div></div>`}).join('')}

function shuffle(a,seed){a=a.slice();for(let i=a.length-1;i>0;i--){let j=(seed*17+i*11)%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function writing(){let h='<h2>Writing</h2><p class="small">10題 Build a Sentence；每題字詞組真正亂序，今日同一題亂序固定不變。</p>';S.forEach((x,i)=>{let t=shuffle(x.slice(0,4),i+17);h+=`<div class="q"><b>${i+1}. Build a Sentence</b><div class="tokens">${t.map(w=>`<button class="token" data-si="${i}" data-tok="${esc(w)}">${esc(w)}</button>`).join('')}</div><div class="answerline" id="line${i}">點選字詞組組成句子</div><button class="ghost sclear" data-si="${i}">清除</button><div class="small">完成後可對照：${esc(x[4])}</div></div>`});h+=`<div class="q"><h3>Write an Email｜0–5</h3><p>Write to Professor Williams: you cannot attend Friday’s neighborhood field visit. Explain why, say that you still want to complete the fieldwork, ask whether you can join another group, and propose an alternative if necessary.</p><textarea id="email"></textarea><select id="emailScore"><option value="">人工模擬評分</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div><div class="q"><h3>Write for an Academic Discussion｜0–5</h3><p><b>Professor:</b> Should governments prioritize physical improvement or preservation of existing communities in urban regeneration?<br><b>Maria:</b> Physical improvement should come first.<br><b>Daniel:</b> Community preservation is equally important.</p><textarea id="disc"></textarea><select id="discScore"><option value="">人工模擬評分</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div><button id="wcalc">計算 Writing raw 0–20</button><div class="score" id="wresult">尚未計分</div>`;return h}
let rec=null,stream=null,recBtn=null,recog=null;async function recordToggle(b){if(recBtn===b){stopRec();return}if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){alert('此裝置不支援瀏覽器錄音；可手動輸入逐字稿與分數。');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});let chunks=[];recBtn=b;rec=new MediaRecorder(stream);const ta=b.closest('.q').querySelector('textarea');let final='';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){try{recog=new SR();recog.lang='en-US';recog.continuous=true;recog.interimResults=true;recog.onresult=e=>{let inter='';for(let i=e.resultIndex;i<e.results.length;i++){let v=e.results[i][0].transcript;if(e.results[i].isFinal)final+=v+' ';else inter+=v}if(ta)ta.value=(final+inter).trim()};recog.start()}catch(e){recog=null}}rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);rec.onstop=()=>{if(ta&&final.trim())ta.value=final.trim();let au=b.closest('.q').querySelector('audio');if(!au){au=document.createElement('audio');au.controls=true;au.style.width='100%';b.closest('.q').appendChild(au)}au.src=URL.createObjectURL(new Blob(chunks,{type:rec?.mimeType||'audio/webm'}));try{recog?.stop()}catch(e){}try{stream?.getTracks().forEach(t=>t.stop())}catch(e){}rec=null;stream=null;recBtn=null;b.textContent='● 錄音';b.classList.remove('recording')};rec.start();b.textContent='■ 停止錄音';b.classList.add('recording')}catch(e){alert('無法取得麥克風權限')}}function stopRec(){try{recog?.stop()}catch(e){}try{rec?.stop()}catch(e){}};
function speaking(){let h='<h2>Speaking｜7 Listen and Repeat＋4 Take an Interview</h2>';REP.forEach((t,i)=>{h+=`<div class="q"><b>${i+1}. Listen and Repeat</b><div class="actions"><button class="play" data-parts='${esc(JSON.stringify([{text:t,lang:ACC[i%4]}]))}'>▶ 播放句子</button><button class="record" type="button">● 錄音</button></div><textarea placeholder="自動逐字稿會寫入這裡，也可手動修正"></textarea><select class="sp"><option value="">最終 0–5 分</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div>`});INT.forEach((t,i)=>{h+=`<div class="q"><b>${i+1}. Take an Interview</b><div class="actions"><button class="play" data-parts='${esc(JSON.stringify([{text:t,lang:ACC[(i+1)%4]}]))}'>▶ 播放問題</button><button class="record" type="button">● 錄音</button><button class="ghost stopaudio" type="button">■ 停止播放</button></div><textarea placeholder="自動逐字稿會寫入這裡，也可手動修正"></textarea><select class="sp"><option value="">Interview 0–5</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select><details><summary>評分標準</summary><p class="small">切題與展開、語速與停頓、pronunciation／rhythm／intonation、intelligibility、grammar／vocabulary。</p></details></div>`});return h+'<button id="scalc">計算 Speaking raw 0–55</button><div class="score" id="sresult">尚未計分</div><p class="small">Listen and Repeat 的逐字稿相似度僅可作建議，最後仍須依 pronunciation／intelligibility 人工修正。1–6 若顯示，僅是本站練習估分，非 ETS 正式換算。</p>'}
function score(){let names=[...new Set($$('.check').map(b=>b.dataset.n))];return names.filter(n=>{let c=$(`input[name="${n}"]:checked`),b=$(`button.check[data-n="${n}"]`);return c&&b&&Number(c.value)===Number(b.dataset.a)}).length}
function bind(){ $$('.check').forEach(b=>b.onclick=()=>{let c=$(`input[name="${b.dataset.n}"]:checked`),q=b.closest('.q'),ok=!!c&&Number(c.value)===Number(b.dataset.a),f=q.querySelector('.feedback');f.className='feedback '+(ok?'ok':'bad');f.textContent=ok?'✓ 正確':'✗ 再聽／再看一次'});$$('.fillcheck').forEach(b=>b.onclick=()=>{let i=$(`[data-fill="${b.dataset.n}"]`),q=b.closest('.q'),ok=norm(i.value)===norm(i.dataset.a);q.querySelector('.feedback').className='feedback '+(ok?'ok':'bad');q.querySelector('.feedback').textContent=ok?'✓ 正確':'✗ 再檢查拼字'});$$('.play').forEach(b=>b.onclick=()=>saySegments(JSON.parse(b.dataset.parts),b));$$('.qplay').forEach(b=>b.onclick=()=>saySegments(JSON.parse(b.dataset.parts),b));$$('.stopaudio').forEach(b=>b.onclick=()=>{try{speechSynthesis.cancel()}catch(e){}});$$('.record').forEach(b=>b.onclick=()=>recordToggle(b));$$('.token').forEach(b=>b.onclick=()=>{let line=$('#line'+b.dataset.si),a=line.dataset.a?JSON.parse(line.dataset.a):[];if(!a.includes(b.dataset.tok)){a.push(b.dataset.tok);line.dataset.a=JSON.stringify(a);line.textContent=a.join(' ')}});$$('.sclear').forEach(b=>b.onclick=()=>{let l=$('#line'+b.dataset.si);l.textContent='點選字詞組組成句子';delete l.dataset.a});if($('#lcalc'))$('#lcalc').onclick=()=>{let ok=score(),tot=[...new Set($$('.check').map(b=>b.dataset.n))].length;$('#lresult').textContent=`Listening raw ${ok}/${tot}｜${tot?Math.round(ok/tot*100):0}%`};if($('#wcalc'))$('#wcalc').onclick=()=>{let bs=0;S.forEach((x,i)=>{let l=$('#line'+i);if(norm(l.textContent)===norm(x[4]))bs++});if($('#emailScore').value===''||$('#discScore').value===''){alert('請先完成 Email 與 Academic Discussion 的 0–5 評分');return}let raw=bs+Number($('#emailScore').value)+Number($('#discScore').value);$('#wresult').textContent=`Writing raw ${raw}/20｜Email ${$('#emailScore').value}/5｜Discussion ${$('#discScore').value}/5`};if($('#scalc'))$('#scalc').onclick=()=>{let ss=$$('.sp');if(ss.some(x=>x.value==='')){alert('請完成全部 11 題 0–5 評分');return}let raw=ss.reduce((a,x)=>a+Number(x.value),0);$('#sresult').textContent=`Speaking raw ${raw}/55｜本站練習估分約 ${(1+5*raw/55).toFixed(1)}（非 ETS 正式換算）`}}
function render(tab){let h='';if(tab==='Reading')h='<h2>Reading｜20 題</h2>'+mcq(R,'r')+'<div class="score">Reading：完成後按各題檢查</div>';if(tab==='Listening')h=listening();if(tab==='Writing')h=writing();if(tab==='Speaking')h=speaking();if(tab==='Review')h='<h2>錯題整理與複盤</h2><p>錯題分類：主旨／細節／推論／語意／口音／記憶／語速／文法詞彙／時間壓力。</p><textarea id="review" placeholder="整理今天錯題、錯因、修正策略與下一步…"></textarea>';$('#app').innerHTML=h;bind()}
const T=['Reading','Listening','Writing','Speaking','Review'];let active='Reading';$('#tabs').innerHTML=T.map(t=>`<button class="tab ${t===active?'active':''}" data-t="${t}">${t}</button>`).join('');$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('active',x===b));active=b.dataset.t;render(active);window.scrollTo({top:0,behavior:'smooth'})});try{$('#notes').value=localStorage.getItem('toefl-notes')||'';$('#save').onclick=()=>localStorage.setItem('toefl-notes',$('#notes').value)}catch(e){};
try{render(active)}catch(e){console.error(e);$('#app').innerHTML='<div class="q bad"><b>題目載入失敗</b><p class="small">請重新整理本頁；本版本已加入初始化錯誤保護，不會再顯示空白頁。</p></div>'}
</script></body></html>
