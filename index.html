<section class="hero"><div class="small">2026 NEW TOEFL ONLY</div><h1>新版 TOEFL iBT<br>4.5 → 5.0 研習站</h1><p class="muted">所有每日練習與模擬考都在本站完成。手機版優先設計；Listening／Speaking 可直接播放英文，Speaking 支援錄音與瀏覽器可用時的自動逐字稿。</p><div class="badges"><span class="badge">目標 4.5 → 5.0</span><span class="badge">全站內作答</span><span class="badge">手機優化</span><span class="badge">本機保存</span></div></section>

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const safe={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

let ts=Number(safe.get('timer')||0),tid=null;function showT(){let h=String(Math.floor(ts/3600)).padStart(2,'0'),m=String(Math.floor(ts%3600/60)).padStart(2,'0'),s=String(ts%60).padStart(2,'0');$('#timer').textContent=`${h}:${m}:${s}`}function startT(){if(tid)return;tid=setInterval(()=>{ts++;safe.set('timer',ts);showT()},1000)}function pauseT(){clearInterval(tid);tid=null}function resetT(){pauseT();ts=0;safe.set('timer',0);showT()}showT();
const readingFill=[['Urban renewal may disr___ long-standing social networks.','upt'],['Housing affor_____ is a major concern in many cities.','dability'],['Researchers study residents’ lived expe_____.','rience'],['Participant obser_____ is common in ethnographic research.','vation'],['Historic preservation may strengthen local iden_____.','tity'],['Public facilities can improve neigh_____ quality of life.','borhood'],['Redevelopment can create both benefits and disp_____.','lacement'],['Planners should consider equi_____ outcomes.','table']];
const daily=[['A community workshop begins at 6:30 p.m. Registration is recommended but not required. Residents unable to attend can submit comments online. What is true?',['Registration is mandatory','People may attend without registering','Only property owners may attend'],1],['The library closes early Friday for maintenance. Evening classes move to Room 204 in the public library. Where should students go?',['Neighborhood center','Public library','City hall'],1],['A housing office asks applicants to upload income documents by September 18. What should an applicant do?',['Submit income documents online','Mail them after September 18','Bring them to class'],0],['A notice says the north entrance is closed, but step-free access remains available through the south entrance. Who is this information especially useful for?',['People needing accessible entry','People buying tickets','People borrowing books'],0]];
const academic=[['Urban regeneration is often evaluated by property values and new infrastructure, but these measures may overlook residents’ social ties and sense of place. What is the main idea?',['Economic indicators are useless','Technical indicators may not capture all effects','Residents oppose all redevelopment'],1],['Place attachment develops through memories, relationships, and everyday routines. What does place attachment refer to?',['Building cost','Emotional bonds with places','Travel time'],1],['Affordable housing policies can reduce displacement when neighborhoods redevelop. What is the relationship described?',['Affordability may help residents remain','Redevelopment always reduces rent','Displacement causes new transit'],0],['Ethnographic interviews provide qualitative evidence that complements administrative statistics. What does complements mean?',['Replaces completely','Adds another useful perspective','Makes statistics inaccurate'],1],['Public interest can include safety, accessibility, affordability, and social continuity. Which conclusion follows?',['Public interest has multiple dimensions','Only safety matters','Affordability is private only'],0],['Historic buildings can support local identity, but preservation may also limit new construction. What tension is described?',['Identity versus development capacity','Transit versus weather','Education versus health'],0],['Resident participation can reveal concerns not visible in technical plans. Why?',['Residents experience daily effects directly','Residents always know engineering better','Technical plans contain no data'],0],['A redevelopment project may improve buildings while disrupting social networks. This illustrates what?',['A trade-off','A spelling error','A guaranteed benefit'],0]];
const listenResp=[['Could you send me the revised housing report by this afternoon?',['Yes, I can finish it before three.','The report was interesting.','I sent the afternoon yesterday.'],0],['Didn’t the professor move the meeting to Friday?',['Yes, she emailed us about it.','Forty students attended.','I prefer meetings.'],0],['Why don’t we conduct the interviews before the semester ends?',['The interview lasted twenty minutes.','Good idea. We will have more time to analyze them.','The semester begins in September.'],1],['Do you mind if I record our conversation for my research?',['Not at all. Go ahead.','I did not read it.','The conversation was long.'],0],['How did residents respond to the proposal?',['It was submitted last month.','Most supported safety improvements, but some worried about costs.','The station is nearby.'],1],['Could we meet near the library instead?',['Sure, that works for me.','The library has many books.','I met her yesterday.'],0],['When is the field visit scheduled?',['At the old factory site.','Next Thursday morning.','About urban history.'],1],['Who should I contact about student housing?',['The housing office can help.','I live near campus.','The rent increased.'],0]];
const longListen=[['Announcement','Attention residents. Elevator maintenance has been moved from Friday to Thursday morning. The north tower elevator will be unavailable from nine to noon. Residents needing step-free access should use the south entrance.','When will maintenance occur?',['Friday morning','Thursday morning','Thursday afternoon'],1],['Conversation','Student: I planned to interview residents on Monday. Advisor: Monday may be difficult because the community center is closed. Why not Tuesday afternoon? Student: That works, and I can analyze the interviews Wednesday.','When will the interviews probably happen?',['Monday','Tuesday afternoon','Wednesday'],1],['Announcement','The public lecture on housing affordability will begin thirty minutes later than announced. Instead of six, it will start at six thirty in Room 201.','What changed?',['The room','The topic','The starting time'],2],['Academic Talk','Place attachment refers to emotional bonds people develop with locations through memories, social relationships, and repeated everyday activities.','What is the talk mainly about?',['Construction costs','Emotional connections to place','Transportation'],1],['Academic Talk','Researchers distinguish quantitative indicators, such as rent levels, from qualitative evidence, such as interviews describing everyday experience. Combining both can produce a fuller understanding of neighborhood change.','Why combine both types of evidence?',['To eliminate interviews','To understand change more fully','To reduce sample size'],1],['Conversation','Student: Should I only interview homeowners? Professor: No. Include tenants too, because redevelopment may affect them differently.','Why include tenants?',['They may experience different effects','They own more buildings','They are easier to contact'],0],['Announcement','Written comments on the redevelopment plan will be accepted until September eighteenth. The public meeting itself is on September twelfth.','What is the final day for written comments?',['September 12','September 18','September 28'],1],['Academic Talk','Preservation can protect cultural identity, but strict preservation rules may reduce the amount of land available for new housing.','What trade-off is mentioned?',['Culture and housing supply','Transit and tourism','Safety and education'],0],['Conversation','Student: My survey response rate is low. Advisor: Try sending one reminder, but do not send repeated messages because participants may feel pressured.','What does the advisor recommend?',['Send one reminder','Cancel the survey','Call every participant daily'],0],['Academic Talk','Public interest is not always a single objective. A project may improve safety while reducing affordability, so planners often need to balance competing benefits and costs.','What is the main point?',['Public interest can involve trade-offs','Safety always outweighs affordability','Costs should be ignored'],0]];
const sentenceQs=[['the city / plans to renovate / several older buildings / next year','The city plans to renovate several older buildings next year.'],['many residents / are concerned about / rising housing costs','Many residents are concerned about rising housing costs.'],['the researchers / wanted to understand / how residents experienced / neighborhood change','The researchers wanted to understand how residents experienced neighborhood change.'],['although the project was expensive / it provided / several important benefits / to the community','Although the project was expensive, it provided several important benefits to the community.'],['because affordable housing was limited / some families / had to move / to other neighborhoods','Because affordable housing was limited, some families had to move to other neighborhoods.'],['public interest / should not be measured / only by / economic benefits','Public interest should not be measured only by economic benefits.'],['preserving historic buildings / may strengthen / a community’s / local identity','Preserving historic buildings may strengthen a community’s local identity.'],['local residents / were invited / to participate in / the planning process','Local residents were invited to participate in the planning process.'],['the study suggests / that better transit / can improve / access to jobs','The study suggests that better transit can improve access to jobs.'],['the professor / asked the students / to submit / their field notes by Friday','The professor asked the students to submit their field notes by Friday.']];

const interviewQs=['What kind of neighborhood would you prefer to live in, and why?','Do you think cities should preserve old buildings even when redevelopment is more profitable?','Describe one change that could improve daily life in your community.','What can planners learn by talking directly with residents?'];
const tabs=['Reading','Listening','Writing','Speaking','Weakness','Mock','Review'];let active=schedule[di][1];if(!tabs.includes(active))active='Reading';$('#tabs').innerHTML=tabs.map(x=>`<button class="tab ${x===active?'active':''}" data-t="${x}">${x}</button>`).join('');$$('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.t;$$('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});
const esc=s=>String(s).replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]||m));function fill(id,p,a){return `<div class="q"><div>${p}</div><input type="text" id="${id}" data-answer="${esc(a)}" placeholder="輸入缺少的字母／文字"><div class="actions"><button class="ghost ckfill" data-id="${id}">檢查答案</button><button class="ghost showans">顯示答案</button></div><div class="feedback"></div><div class="answer">答案：${esc(a)}</div></div>`}function mcq(id,p,c,a,audio=false){return `<div class="q">${audio?`<div class="audio"><button class="play" data-text="${esc(p)}">▶ 播放問題</button><span class="small">建議只播放一次</span></div>`:`<div>${p}</div>`}${c.map((x,i)=>`<label class="option"><input type="radio" name="${id}" value="${i}">${x}</label>`).join('')}<div class="actions"><button class="ghost ckmcq" data-name="${id}" data-a="${a}">檢查答案</button></div><div class="feedback"></div></div>`}function scoreBox(id,label){return `<div class="score" id="${id}">${label}：尚未計分</div>`}function rubric(id,type){let d=type==='Interview'?'5：完整切題且充分展開；語流自然，發音、節奏與語調清晰；文法詞彙範圍與準確度高。 4：整體清楚且有展開，偶有停頓或語言錯誤但不妨礙理解。 3：可理解但展開有限，停頓或錯誤較明顯。 2：回應部分完成，語流與語言控制有限。 1：只有零碎相關內容。 0：無有效回應。':type==='Email'?'5：所有溝通目的完整且自然，語域適切，句法與詞彙多樣，錯誤極少。 4：目的完整，展開充分，少量錯誤不影響溝通。 3：多數目的完成但展開或語域有限。 2：部分完成且錯誤較多。 1：只有極少相關資訊。 0：無有效回應。':'5：立場切題且充分展開，細節具體，句法詞彙多樣且準確。 4：清楚切題、有支持與少量錯誤。 3：可理解但展開較有限。 2：部分切題且語言控制有限。 1：零碎內容。 0：無有效回應。';return `<details><summary>${type} 0–5 模擬 rubric</summary><p class="small">${d}</p><div class="rub"><span>選擇 holistic score</span><select id="${id}"><option value="">尚未評分</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div></details>`}
function render(){let h='';if(active==='Reading'){h=`<h3>Reading｜約20題</h3>${readingFill.map((x,i)=>fill('rf'+i,x[0],x[1])).join('')}<h4>Read in Daily Life</h4>${daily.map((x,i)=>mcq('rd'+i,x[0],x[1],x[2])).join('')}<h4>Read an Academic Passage</h4>${academic.map((x,i)=>mcq('ra'+i,x[0],x[1],x[2])).join('')}${scoreBox('rscore','Reading')}<button onclick="scoreObjective('r')">計算 Reading 成績</button>`}else if(active==='Listening'){h=`<h3>Listening｜18題</h3><p class="small">腳本不顯示。按播放後再作答。</p>${listenResp.map((x,i)=>mcq('lr'+i,x[0],x[1],x[2],true)).join('')}${longListen.map((x,i)=>mcq('ll'+i,x[1],x[3],x[4],true)).join('')}${scoreBox('lscore','Listening')}<button onclick="scoreObjective('l')">計算 Listening 成績</button>`}else if(active==='Writing'){h=`<h3>Writing｜10 + Email + Discussion</h3>${sentenceQs.map((x,i)=>fill('ws'+i,x[0],x[1])).join('')}<div class="q"><h4>Write an Email</h4><p>你無法參加週五的 neighborhood field visit。寫信給 Professor Williams：說明原因、表達仍希望完成 fieldwork、詢問能否加入另一組、若不行提出替代方式。</p><textarea id="wemail"></textarea>${rubric('erub','Email')}</div><div class="q"><h4>Academic Discussion</h4><p><b>Professor:</b> Should governments prioritize physical improvement or preservation of existing communities in urban regeneration?<br><b>Maria:</b> Physical improvement should come first.<br><b>Daniel:</b> Community preservation is equally important.</p><textarea id="wdisc"></textarea>${rubric('drub','Discussion')}</div>${scoreBox('wscore','Writing raw 0–20')}<button onclick="scoreWriting()">計算 Writing 成績</button>`}else if(active==='Speaking'){h=`<h3>Speaking｜7 Repeat + 4 Interview</h3><p class="small">先播放，再錄音。若瀏覽器支援 SpeechRecognition，逐字稿會自動寫入。</p>${repeatQs.map((x,i)=>speakQ('rep'+i,x,true)).join('')}${interviewQs.map((x,i)=>speakQ('int'+i,x,false)).join('')}${scoreBox('sscore','Speaking raw 0–55')}<button onclick="scoreSpeaking()">計算 Speaking 成績</button>`}else if(active==='Weakness'){h=`<h3>弱項補強</h3><p>先完成 Reading 4題、Listening 4題、Writing 2題、Speaking 2題，再把最低正確率／最卡的能力記到下方弱項筆記。</p>${readingFill.slice(0,4).map((x,i)=>fill('wf'+i,x[0],x[1])).join('')}${listenResp.slice(0,4).map((x,i)=>mcq('wl'+i,x[0],x[1],x[2],true)).join('')}${sentenceQs.slice(0,2).map((x,i)=>fill('ww'+i,x[0],x[1])).join('')}${repeatQs.slice(0,2).map((x,i)=>speakQ('wr'+i,x,true)).join('')}` }else if(active==='Mock'){h=`<h3>週六完整模擬考｜全站內完成</h3><p class="muted">依序完成下列四區，不查字典、不看答案。這是本站自製模擬考，不是 ETS 真題。</p><div class="actions"><button onclick="mockPart('mr')">Reading 模考</button><button onclick="mockPart('ml')">Listening 模考</button><button onclick="mockPart('mw')">Writing 模考</button><button onclick="mockPart('ms')">Speaking 模考</button></div><div id="mock"></div>`}else{h=`<h3>錯題複盤</h3><textarea id="review" placeholder="錯題：\n我的答案：\n正確答案：\n錯因：詞彙／句法／注意力／速度／發音／展開\n下次避免方式："></textarea><div class="actions"><button onclick="safe.set('review',$('#review').value)">儲存複盤</button></div>`}$('#content').innerHTML=h;wire();restoreText()}
function speakQ(id,text,repeat){return `<div class="q"><b>${repeat?'Listen and Repeat':'Take an Interview'}</b><div class="audio"><button class="play" data-text="${esc(text)}">▶ 播放${repeat?'句子':'問題'}</button></div><div class="rec"><button class="record" data-id="${id}" data-prompt="${repeat?esc(text):''}">● 錄音</button><span class="small" id="${id}st"></span><audio id="${id}au" controls hidden></audio></div><textarea id="${id}tx" placeholder="錄音逐字稿會出現在這裡，也可手動修改"></textarea>${repeat?`<div class="small" id="${id}auto"></div>`:rubric(id+'rub','Interview')}<div class="rub"><span>${repeat?'最終分數（依內容＋清晰度修正）':'Interview holistic score'}</span><select id="${id}score"><option value="">未評分</option>${[0,1,2,3,4,5].map(n=>`<option>${n}</option>`).join('')}</select></div></div>`}
function wire(){$$('.play').forEach(b=>b.onclick=()=>speak(b.dataset.text));$$('.ckfill').forEach(b=>b.onclick=()=>checkFill($('#'+b.dataset.id)));$$('[data-answer]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();checkFill(i)}});$$('.showans').forEach(b=>b.onclick=()=>{let a=b.closest('.q').querySelector('.answer'),on=a.classList.toggle('show');b.textContent=on?'隱藏答案':'顯示答案'});$$('.ckmcq').forEach(b=>b.onclick=()=>checkMcq(b));$$('.record').forEach(b=>b.onclick=()=>recordToggle(b));$$('textarea,input[type=text],select').forEach(e=>{if(!e.id)return;let k='v-'+e.id;if(safe.get(k)!=null)e.value=safe.get(k);e.oninput=()=>safe.set(k,e.value);e.onchange=()=>safe.set(k,e.value)})}
function fb(q,ok,t){let e=q.querySelector('.feedback');e.className='feedback show '+(ok?'ok':'no');e.textContent=t}function norm(s){return String(s).trim().toLowerCase().replace(/[.,!?']/g,'').replace(/\s+/g,' ')}function checkFill(i){let ok=norm(i.value)===norm(i.dataset.answer);fb(i.closest('.q'),ok,ok?'✓ 正確':'✗ 再檢查一次');return ok}function checkMcq(b){let p=document.querySelector(`input[name="${b.dataset.name}"]:checked`);if(!p){fb(b.closest('.q'),false,'請先選一個答案');return false}let ok=Number(p.value)===Number(b.dataset.a);fb(b.closest('.q'),ok,ok?'✓ 正確':'✗ 再聽／再讀一次');return ok}
let voiceReady=false;function speak(t){if(!('speechSynthesis'in window)){alert('目前 App 內建瀏覽器不支援語音播放。請用右上角選單「在瀏覽器中開啟」後再試。');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;let vs=speechSynthesis.getVoices(),v=vs.find(x=>/^en-US/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;try{speechSynthesis.speak(u);setTimeout(()=>{if(speechSynthesis.paused)speechSynthesis.resume()},100)}catch(e){alert('語音播放受目前 App 限制，請改用 Safari／Chrome 開啟本站。')}}if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=()=>{voiceReady=true};
function scoreObjective(which){let pre=which==='r'?['rf','rd','ra']:['lr','ll'],tot=0,ok=0;pre.forEach(p=>{if(p==='rf')$$(`[id^="${p}"]`).forEach(i=>{tot++;if(norm(i.value)===norm(i.dataset.answer))ok++});else $$(`input[name^="${p}"]:checked`).forEach(i=>{}),[...new Set($$(`input[name^="${p}"]`).map(x=>x.name))].forEach(n=>{tot++;let c=$(`input[name="${n}"]:checked`),b=$(`.ckmcq[data-name="${n}"]`);if(c&&Number(c.value)===Number(b.dataset.a))ok++})});let id=which==='r'?'rscore':'lscore';$('#'+id).textContent=`${which==='r'?'Reading':'Listening'}：${ok}/${tot}｜${tot?Math.round(ok/tot*100):0}%`}
function scoreWriting(){let s=0;sentenceQs.forEach((x,i)=>{let e=$('#ws'+i);if(e&&norm(e.value)===norm(e.dataset.answer))s++});let e=Number($('#erub').value),d=Number($('#drub').value);if($('#erub').value===''||$('#drub').value===''){alert('請先完成 Email 與 Discussion 的 0–5 rubric 評分');return}let raw=s+e+d,band=(1+5*raw/20);band=Math.round(band*2)/2;$('#wscore').textContent=`Writing raw ${raw}/20｜Sentence ${s}/10｜Email ${e}/5｜Discussion ${d}/5｜站內練習估分約 ${band.toFixed(1)}（非 ETS 正式換算）`}
function scoreSpeaking(){let sels=$$('select[id$="score"]');if(sels.length<11||sels.some(x=>x.value==='')){alert('請先完成 7 題 Repeat 與 4 題 Interview 的 0–5 評分');return}let raw=sels.reduce((a,x)=>a+Number(x.value),0),band=Math.round((1+5*raw/55)*2)/2;$('#sscore').textContent=`Speaking raw ${raw}/55｜站內練習估分約 ${band.toFixed(1)}（非 ETS 正式換算）`}
function sim(a,b){let A=norm(a).split(' '),B=norm(b).split(' '),m=A.length,n=B.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));return 1-d[m][n]/Math.max(m,n,1)}function sug(v){return v>=.97?5:v>=.84?4:v>=.66?3:v>=.42?2:v>=.15?1:0}
let rec=null,stream=null,recogn=null,btnNow=null,chunks=[],txt='';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;async function recordToggle(b){let id=b.dataset.id;if(btnNow===b&&rec?.state==='recording'){stopRec();return}if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){alert('目前 App 內建預覽不允許麥克風。請在 Safari／Chrome 開啟本站後再錄音。');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];txt='';btnNow=b;rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{let au=$('#'+id+'au');au.src=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'}));au.hidden=false;let f=$('#'+id+'tx');if(txt.trim()){f.value=txt.trim();safe.set('v-'+f.id,f.value)}if(b.dataset.prompt&&txt.trim()){let n=sug(sim(b.dataset.prompt,txt)),s=$('#'+id+'score');s.value=n;$('#'+id+'auto').textContent=`逐字稿內容相似度建議 ${n}/5；請回放錄音，依 pronunciation/intelligibility 人工修正。`}$('#'+id+'st').textContent='錄音完成';stream?.getTracks().forEach(t=>t.stop());rec=null;btnNow=null};if(SR){recogn=new SR();recogn.lang='en-US';recogn.continuous=true;recogn.interimResults=true;let fin='';recogn.onresult=e=>{let inter='';for(let i=e.resultIndex;i<e.results.length;i++){let v=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=v+' ';else inter+=v}txt=(fin+inter).trim();$('#'+id+'tx').value=txt};try{recogn.start()}catch(e){}}rec.start();b.textContent='■ 停止錄音';$('#'+id+'st').textContent='錄音中…'}catch(e){alert('無法取得麥克風權限。請改用 Safari／Chrome 並允許麥克風。')}}function stopRec(){try{recogn?.stop()}catch(e){}try{rec?.stop()}catch(e){}if(btnNow)btnNow.textContent='● 錄音'}
function mockPart(p){let m=$('#mock');if(p==='mr')m.innerHTML=`<h4>Mock Reading</h4>${readingFill.map((x,i)=>fill('mrf'+i,x[0],x[1])).join('')}${daily.concat(academic).map((x,i)=>mcq('mrm'+i,x[0],x[1],x[2])).join('')}<div class="score">完成後依 Reading 同樣方式自行核對。</div>`;if(p==='ml')m.innerHTML=`<h4>Mock Listening</h4>${listenResp.concat(longListen.map(x=>[x[1],x[3],x[4]])).map((x,i)=>mcq('ml'+i,x[0],x[1],x[2],true)).join('')}`;if(p==='mw')m.innerHTML=`<h4>Mock Writing</h4>${sentenceQs.map((x,i)=>fill('mws'+i,x[0],x[1])).join('')}<div class="q"><b>Email</b><textarea id="mwemail"></textarea>${rubric('mwer','Email')}</div><div class="q"><b>Academic Discussion</b><textarea id="mwdisc"></textarea>${rubric('mwdr','Discussion')}</div>`;if(p==='ms')m.innerHTML=`<h4>Mock Speaking</h4>${repeatQs.map((x,i)=>speakQ('msr'+i,x,true)).join('')}${interviewQs.map((x,i)=>speakQ('msi'+i,x,false)).join('')}`;wire()}
