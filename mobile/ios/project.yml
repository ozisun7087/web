name: TOEFLStudyLab
options:
  bundleIdPrefix: tw.leon
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
targets:
  TOEFLStudyLab:
    type: application
    platform: iOS
    sources:
      - TOEFLStudyLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.leon.toeflstudy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TOEFL Study Lab
        INFOPLIST_KEY_NSMicrophoneUsageDescription: TOEFL Study Lab needs microphone access for Speaking practice recording.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: TOEFL Study Lab may use speech recognition for Speaking practice transcripts.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
