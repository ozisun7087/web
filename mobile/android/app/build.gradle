plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.leon.toeflstudy'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.leon.toeflstudy'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
