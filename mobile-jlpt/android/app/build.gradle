plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.ozisun.jlptstudylab'
    compileSdk 36

    defaultConfig {
        applicationId 'tw.ozisun.jlptstudylab'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.3.0'
    }

    signingConfigs {
        release {
            def ks = System.getenv('JLPT_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('JLPT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('JLPT_KEY_ALIAS') ?: 'upload'
                keyPassword System.getenv('JLPT_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('JLPT_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
